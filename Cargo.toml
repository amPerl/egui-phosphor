[package]
name = "egui-phosphor"
description = "Phosphor icons for egui"
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amPerl/egui-phosphor"

[dependencies]
egui = { version = "0.35", default-features = false }

[features]
default = ["regular"]
thin = []
light = []
regular = []
bold = []
fill = []
# Compile-time font subsetting via the `subset!` macro. Adds no dependencies.
subset = []

[dev-dependencies]
eframe = "0.35"

[[example]]
name = "multiple_variants"
required-features = ["thin", "light", "regular", "bold", "fill"]

[[example]]
name = "subset"
required-features = ["subset", "regular"]

[[test]]
name = "subset"
required-features = ["subset", "regular"]

[[test]]
name = "multi_variant"
required-features = ["subset", "regular", "fill"]
